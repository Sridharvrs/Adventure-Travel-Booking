<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 | Stackly</title>

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/error.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
</head>

<body>

  <main class="error-page">

    <!-- Background decorations -->
    <div class="error-orb orb-one"></div>
    <div class="error-orb orb-two"></div>

    <div class="error-content">

      <div class="error-top">
        <a href="index.html" class="error-logo">
          <img src="images/logo.webp" alt="Stackly">
        </a>

        <span class="error-code-small">ERROR 404</span>
      </div>


      <!-- Main Visual -->
      <div class="adventure-visual">

        <div class="mountain mountain-back"></div>
        <div class="mountain mountain-mid"></div>
        <div class="mountain mountain-front"></div>

        <div class="sun"></div>

        <div class="compass">
          <i class="fas fa-location-arrow"></i>
        </div>

        <div class="error-number">
          <span>4</span>
          <span class="zero">0</span>
          <span>4</span>
        </div>

        <div class="trail trail-one"></div>
        <div class="trail trail-two"></div>

      </div>


      <!-- Message -->
      <div class="error-message">

        <span class="error-eyebrow">
          <i class="fas fa-compass"></i>
          OFF THE MAP
        </span>

        <h1>
          Looks like you've<br>
          <span>wandered too far.</span>
        </h1>

        <p>
          The trail you're looking for doesn't exist,
          has moved, or disappeared into the wild.
          Let's get you back on the right path.
        </p>

        <div class="error-actions">

          <a onclick="window.history.back()" class="error-primary">
            <i class="fas fa-house"></i>
            Back to dashboard
          </a>

          <a href="destinations.html" class="error-secondary">
            Go home
            <i class="fas fa-arrow-right"></i>
          </a>

        </div>

      </div>


      <!-- Bottom hint -->
      <div class="error-footer">
        <span>
          <i class="fas fa-mountain-sun"></i>
          KEEP WANDERING
        </span>

        <span class="error-line"></span>

        <span>
          Stackly
        </span>
      </div>

    </div>

  </main>

  <script src="js/404.js"></script>

</body>
</html>
